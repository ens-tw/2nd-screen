<svg class="art" viewBox="0 0 1728 500" width="1728" role="img" aria-label="植入三要素：縮電池、位置、接線（Joe Grand 實照）" xmlns="http://www.w3.org/2000/svg">
<g data-beat="1" data-fx="pop"><clipPath id="c7-sp1"><rect x="0" y="0" width="560" height="320" rx="18"/></clipPath><rect x="0" y="0" width="560" height="320" rx="18" style="fill:var(--hair-soft)"/><image href="media/sp1.jpg" x="0" y="0" width="560" height="320" preserveAspectRatio="xMidYMid meet" clip-path="url(#c7-sp1)"/><rect x="0" y="0" width="560" height="320" rx="18" style="fill:none;stroke:var(--hair);stroke-width:2"/><text x="0" y="378" font-size="44" font-weight="700" text-anchor="start" style="fill:var(--chapter)">SP1 騰出空間</text><text x="0" y="434.0" font-size="40" font-weight="400" text-anchor="start" style="fill:var(--text)">電池 100→70 mAh</text><text x="0" y="486.0" font-size="40" font-weight="400" text-anchor="start" style="fill:var(--text)">電量計永遠顯示 100%</text></g><g data-beat="2" data-fx="pop"><clipPath id="c8-sp2"><rect x="584" y="0" width="560" height="320" rx="18"/></clipPath><rect x="584" y="0" width="560" height="320" rx="18" style="fill:var(--hair-soft)"/><image href="media/sp2.jpg" x="584" y="0" width="560" height="320" preserveAspectRatio="xMidYMid meet" clip-path="url(#c8-sp2)"/><rect x="584" y="0" width="560" height="320" rx="18" style="fill:none;stroke:var(--hair);stroke-width:2"/><text x="584" y="378" font-size="44" font-weight="700" text-anchor="start" style="fill:var(--chapter)">SP2 植入位置</text><text x="584" y="434.0" font-size="40" font-weight="400" text-anchor="start" style="fill:var(--text)">塞進電池讓出的腔體</text><text x="584" y="486.0" font-size="40" font-weight="400" text-anchor="start" style="fill:var(--text)">搭上 OLED 的 SPI</text></g><g data-beat="3" data-fx="pop"><clipPath id="c9-sp3"><rect x="1168" y="0" width="560" height="320" rx="18"/></clipPath><rect x="1168" y="0" width="560" height="320" rx="18" style="fill:var(--hair-soft)"/><image href="media/sp3.jpg" x="1168" y="0" width="560" height="320" preserveAspectRatio="xMidYMid meet" clip-path="url(#c9-sp3)"/><rect x="1168" y="0" width="560" height="320" rx="18" style="fill:none;stroke:v